<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="bauhaus">
  <title>Berliner Platz 1 NEU (Kapitel 1–6) 德語互動學習工作室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;

      /* Bauhaus Palette */
      --background: #f5f0e8;
      --surface-container-low: #f2ede5;
      --surface-container: #eee9e0;
      --surface-container-high: #e8e3da;
      --surface-white: #ffffff;

      --on-surface: #1a1a1a;
      --on-surface-variant: #4a4a4a;

      --outline: #1a1a1a;
      --outline-variant: #d0cbc3;

      --primary: #1a1a1a;
      --on-primary: #ffffff;
      --primary-container: #ffcc00;
      --on-primary-container: #1a1a1a;
      --secondary: #e63b2e;
      --tertiary: #0055ff;
      --on-tertiary: #ffffff;
      --error: #cc0000;
      --on-error: #ffffff;

      /* Semantic & Gender Tokens (all >= 4.5:1 contrast) */
      --positive: #0f6b3a;
      --on-positive: #ffffff;
      --positive-soft: #dff3e7;
      --warning: #9a5b00;
      --warning-soft: #fff3cc;
      --error-soft: #fde8e8;

      --gender-m: #0055ff;
      --gender-m-soft: #e3ecff;
      --gender-n: #0f6b3a;
      --gender-n-soft: #dff3e7;
      --gender-f: #cc0000;
      --gender-f-soft: #fde8e8;
      --gender-p: #5b21b6;
      --gender-p-soft: #efe8ff;
      --verb-accent: #ffcc00;

      /* Focus */
      --focus: #0055ff;

      /* Data series */
      --data-1: #e63b2e;
      --data-2: #0055ff;
      --data-3: #1a1a1a;
      --data-4: #9a7300;
      --data-context: #b5afa5;

      /* Fonts */
      --font-headline: 'Noto Sans TC', 'Space Grotesk', sans-serif;
      --font-body: 'Noto Sans TC', 'Inter', sans-serif;
      --font-label: 'Noto Sans TC', 'Space Grotesk', sans-serif;

      /* Type scale (Tool) */
      --display-size: clamp(1.75rem, 1.4rem + 1.4vw, 2.5rem);
      --headline-size: clamp(1.25rem, 1.1rem + 0.5vw, 1.625rem);
      --subhead-size: clamp(1.0625rem, 1rem + 0.25vw, 1.2rem);
      --body-size: clamp(0.9375rem, 0.9rem + 0.15vw, 1rem);
      --label-size: 0.78rem;

      /* Shape */
      --rounded: 0.125rem;
      --rounded-lg: 0.25rem;
      --rounded-full: 0.5rem;

      /* Style effects */
      --border-thick: 3px solid var(--outline);
      --border-medium: 2px solid var(--outline);
      --offset-shadow: 5px 5px 0 var(--outline);
      --offset-shadow-sm: 3px 3px 0 var(--outline);
      --rule-heavy: 6px solid var(--outline);

      /* Spacing scale */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;
      --space-2xl: 4rem;

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      overflow-x: clip;
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.6;
    }
    header { position: static !important; }
    button, input, select, textarea { font-family: inherit; }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .app-shell {
      max-width: 1220px;
      margin: 0 auto;
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-lg);
    }
    .app-shell * { min-width: 0; }

    /* Header */
    .hero-header {
      border: var(--border-thick);
      box-shadow: var(--offset-shadow);
      background: var(--surface-container-low);
      padding: var(--space-lg);
      border-top: var(--space-sm) solid var(--secondary);
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: var(--space-lg);
      align-items: start;
    }
    .kicker {
      display: inline-block;
      background: var(--primary);
      color: var(--on-primary);
      font-family: var(--font-label);
      font-weight: 700;
      font-size: var(--label-size);
      padding: var(--space-xs) var(--space-sm);
      letter-spacing: 0.04em;
      margin-bottom: var(--space-sm);
    }
    .title {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--display-size);
      line-height: 1.15;
      margin: 0 0 var(--space-sm) 0;
    }
    .title mark {
      background: var(--primary-container);
      color: var(--on-primary-container);
      padding: 0 var(--space-xs);
    }
    .subtitle {
      color: var(--on-surface-variant);
      margin: 0;
      max-width: 65ch;
    }
    .status-panel {
      border: var(--border-medium);
      background: var(--surface-white);
      padding: var(--space-md);
      display: grid;
      gap: var(--space-sm);
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--outline-variant);
      padding-bottom: var(--space-xs);
      font-size: 0.9rem;
    }
    .stat-row:last-child { border-bottom: none; padding-bottom: 0; }
    .stat-val {
      font-family: var(--font-headline);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: 1.1rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      min-height: 44px;
      padding: var(--space-sm) var(--space-md);
      border: var(--border-thick);
      border-radius: var(--rounded);
      background: var(--surface-white);
      color: var(--on-surface);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: var(--offset-shadow-sm);
      transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
    }
    .btn:hover {
      background: var(--primary);
      color: var(--on-primary);
      transform: translate(-1px, -1px);
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    .btn-primary {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .btn-primary:hover {
      background: var(--primary);
      color: var(--on-primary);
    }
    .btn-blue {
      background: var(--tertiary);
      color: var(--on-tertiary);
    }
    .btn-sm {
      min-height: 36px;
      padding: var(--space-xs) var(--space-sm);
      font-size: 0.82rem;
      border-width: 2px;
      box-shadow: 2px 2px 0 var(--outline);
    }
    .btn-tts {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 34px;
      padding: 4px 10px;
      border: var(--border-medium);
      border-radius: var(--rounded);
      background: var(--surface-white);
      color: var(--on-surface);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background-color var(--dur-micro) var(--ease-out);
    }
    .btn-tts:hover {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    /* Chapter Nav */
    .chapter-nav {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      padding-bottom: var(--space-sm);
      border-bottom: var(--rule-heavy);
    }
    .nav-tab {
      min-height: 44px;
      padding: var(--space-sm) var(--space-md);
      border: var(--border-thick);
      border-radius: var(--rounded);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--offset-shadow-sm);
      text-align: left;
      transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
    }
    .nav-tab small {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--on-surface-variant);
    }
    .nav-tab.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
      transform: translate(-1px, -1px);
    }
    .nav-tab:hover:not(.active) {
      background: var(--surface-container-high);
    }

    /* Chapter Banner & Subtabs */
    .chapter-workspace {
      display: grid;
      gap: var(--space-lg);
    }
    .chapter-banner {
      border: var(--border-thick);
      background: var(--surface-white);
      padding: var(--space-lg);
      box-shadow: var(--offset-shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-md);
    }
    .chapter-banner.accent-k1 { border-top: 8px solid var(--tertiary); }
    .chapter-banner.accent-k2 { border-top: 8px solid var(--secondary); }
    .chapter-banner.accent-k3 { border-top: 8px solid var(--primary-container); }
    .chapter-banner.accent-k4 { border-top: 8px solid var(--gender-n); }
    .chapter-banner.accent-k5 { border-top: 8px solid var(--gender-p); }
    .chapter-banner.accent-k6 { border-top: 8px solid var(--primary); }
    .chapter-banner.accent-rast { border-top: 8px solid var(--secondary); background: var(--primary-container); }

    .subtab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    .subtab-btn {
      min-height: 44px;
      padding: var(--space-sm) var(--space-lg);
      border: var(--border-thick);
      background: var(--surface-container);
      color: var(--on-surface);
      font-weight: 700;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: var(--primary);
      color: var(--on-primary);
    }

    /* Flashcards Section */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border: var(--border-medium);
      background: var(--surface-container-low);
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
    }
    .chip {
      min-height: 36px;
      padding: 4px 12px;
      border: var(--border-medium);
      background: var(--surface-white);
      color: var(--on-surface);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .legend-strip {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: center;
      font-size: 0.82rem;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-weight: 700;
      font-size: 0.78rem;
      border: 2px solid var(--outline);
      border-radius: var(--rounded);
    }
    .badge-m { background: var(--gender-m); color: var(--on-tertiary); }
    .badge-n { background: var(--gender-n); color: var(--on-positive); }
    .badge-f { background: var(--gender-f); color: var(--on-error); }
    .badge-p { background: var(--gender-p); color: var(--on-primary); }
    .badge-v { background: var(--verb-accent); color: var(--on-primary-container); }

    .flashcard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
      gap: var(--space-lg);
    }
    .flip-card {
      perspective: 1000px;
      min-height: 290px;
      cursor: pointer;
    }
    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 290px;
      transition: transform var(--dur-short) var(--ease-out);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-inner {
      transform: rotateY(180deg);
    }
    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border: var(--border-thick);
      box-shadow: var(--offset-shadow);
      background: var(--surface-white);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }
    .flip-face.back {
      transform: rotateY(180deg);
      background: var(--surface-container-low);
    }
    .flip-card.mastered .flip-face.front {
      background: var(--positive-soft);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-xs);
    }
    .word-main {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1.25;
      margin: var(--space-sm) 0;
      word-break: break-word;
    }
    .word-main.gender-m { color: var(--gender-m); }
    .word-main.gender-n { color: var(--gender-n); }
    .word-main.gender-f { color: var(--gender-f); }
    .word-main.gender-p { color: var(--gender-p); }
    .trennbar-prefix {
      background: var(--primary-container);
      color: var(--on-primary-container);
      padding: 0 4px;
      border-bottom: 3px solid var(--outline);
    }
    .card-hint {
      font-size: 0.85rem;
      color: var(--on-surface-variant);
    }
    .card-example {
      border-left: 4px solid var(--tertiary);
      padding-left: var(--space-sm);
      background: var(--surface-white);
      padding: var(--space-xs) var(--space-sm);
      font-size: 0.88rem;
    }

    /* Interactive Tools Layout */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr));
      gap: var(--space-lg);
    }
    .tool-block {
      border: var(--border-thick);
      box-shadow: var(--offset-shadow);
      background: var(--surface-white);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-md);
      align-content: start;
    }
    .tool-block.full-span {
      grid-column: 1 / -1;
    }
    .tool-title {
      font-family: var(--font-headline);
      font-size: var(--headline-size);
      font-weight: 700;
      margin: 0;
      border-bottom: var(--border-thick);
      padding-bottom: var(--space-xs);
    }
    .field-group {
      display: grid;
      gap: var(--space-xs);
    }
    .field-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--on-surface);
    }
    .bauhaus-input, .bauhaus-select {
      min-height: 44px;
      padding: 8px 12px;
      border: none;
      border-bottom: var(--border-thick);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
    }
    .bauhaus-select { padding-right: 28px; }
    .bauhaus-input:focus, .bauhaus-select:focus {
      border-bottom-color: var(--tertiary);
    }

    /* Tables */
    .bauhaus-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .bauhaus-table th {
      background: var(--surface-container-high);
      text-align: left;
      padding: 8px 10px;
      border-bottom: var(--border-thick);
      font-weight: 700;
    }
    .bauhaus-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--outline-variant);
    }

    /* Output Highlight Box */
    .result-box {
      border: var(--border-medium);
      background: var(--surface-container-low);
      padding: var(--space-md);
    }
    .result-box.highlight {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    /* Satzklammer Blocks */
    .klammer-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: stretch;
    }
    .klammer-slot {
      border: var(--border-medium);
      background: var(--surface-white);
      padding: var(--space-sm) var(--space-md);
      min-width: 90px;
    }
    .klammer-slot.pos2 {
      background: var(--gender-m);
      color: var(--on-tertiary);
    }
    .klammer-slot.end {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .klammer-slot small {
      display: block;
      font-size: 0.7rem;
      opacity: 0.85;
      font-weight: 700;
    }

    /* Clock SVG */
    .clock-wrap {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: var(--space-lg);
      align-items: center;
    }
    .clock-svg {
      width: 180px;
      height: 180px;
      border: var(--border-thick);
      border-radius: var(--rounded-lg);
      background: var(--surface-white);
      box-shadow: var(--offset-shadow-sm);
    }

    /* Family Tree */
    .family-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--space-sm);
    }
    .family-node {
      border: var(--border-medium);
      padding: var(--space-sm);
      background: var(--surface-container-low);
      cursor: pointer;
      text-align: left;
      min-height: 44px;
    }
    .family-node.active {
      background: var(--primary-container);
      box-shadow: var(--offset-shadow-sm);
    }

    /* Quiz Engine */
    .quiz-panel {
      border: var(--border-thick);
      box-shadow: var(--offset-shadow);
      background: var(--surface-white);
      padding: var(--space-lg);
      display: grid;
      gap: var(--space-md);
    }
    .quiz-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: var(--space-sm);
    }
    .quiz-opt {
      min-height: 48px;
      padding: var(--space-sm) var(--space-md);
      border: var(--border-thick);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: background-color var(--dur-micro) var(--ease-out);
    }
    .quiz-opt:hover:not(:disabled) {
      background: var(--primary-container);
    }
    .quiz-opt.correct {
      background: var(--positive);
      color: var(--on-positive);
    }
    .quiz-opt.wrong {
      background: var(--error);
      color: var(--on-error);
    }
    .progress-bar-track {
      height: 14px;
      border: var(--border-medium);
      background: var(--surface-container);
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--tertiary);
      transition: width var(--dur-short) var(--ease-out);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .app-shell { padding: var(--space-sm); }
      .hero-header { grid-template-columns: 1fr; }
      .clock-wrap { grid-template-columns: 1fr; }
      .chapter-banner { padding: var(--space-md); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- HEADER -->
    <header class="hero-header">
      <div>
        <span class="kicker">BERLINER PLATZ 1 NEU · A1 基礎互動課程</span>
        <h1 class="title">德語互動學習工作室 <mark>Kapitel 1–6</mark></h1>
        <p class="subtitle">整合第一至第六課核心單字閃卡（詞性分色＋真人語音朗讀）、互動文法模擬器與隨機題庫測驗，助你快速掌握日常生活德語。</p>
        <div style="display:flex; flex-wrap:wrap; gap:var(--space-sm); margin-top:var(--space-md); align-items:center;">
          <button type="button" class="btn btn-sm" id="btn-tts-speed" onclick="toggleTtsSpeed()">🔊 語速：正常 (0.95x)</button>
          <button type="button" class="btn btn-sm" id="btn-reset-progress" onclick="handleResetProgress(this)">重置學習紀錄</button>
          <span id="tts-status" style="font-size:0.82rem; color:var(--on-surface-variant);"></span>
        </div>
      </div>

      <aside class="status-panel" aria-label="學習進度總覽">
        <div class="stat-row">
          <span>已掌握單字</span>
          <span class="stat-val" id="stat-mastered">0 / 0</span>
        </div>
        <div class="stat-row">
          <span>測驗累積作答</span>
          <span class="stat-val" id="stat-quizzes">0 題</span>
        </div>
        <div class="stat-row">
          <span>總正確率</span>
          <span class="stat-val" id="stat-accuracy">—</span>
        </div>
        <div class="stat-row">
          <span>錯題複習庫</span>
          <span class="stat-val" id="stat-mistakes">0 題</span>
        </div>
      </aside>
    </header>

    <!-- CHAPTER NAVIGATION -->
    <nav class="chapter-nav" id="chapter-nav" aria-label="章節導覽"></nav>

    <!-- MAIN WORKSPACE -->
    <main id="workspace" class="chapter-workspace"></main>
  </div>

  <api-shim></api-shim>

    // =========================================================================
    // 5. TTS AUDIO ENGINE (Web Speech API de-DE)
    // =========================================================================
    function speakGerman(text) {
      const statusEl = document.getElementById(`tts-status`);
      if (!(`speechSynthesis` in window)) {
        if (statusEl) statusEl.textContent = `此瀏覽器環境不支援語音朗讀 API。`;
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const cleanText = String(text).replace(/\|/g, ``);
        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.lang = `de-DE`;
        utter.rate = APP_STATE.ttsRate;
        const voices = window.speechSynthesis.getVoices();
        const deVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(`de`));
        if (deVoice) utter.voice = deVoice;
        if (statusEl) statusEl.textContent = `正在朗讀：「${cleanText}」`;
        utter.onend = () => {
          const s = document.getElementById(`tts-status`);
          if (s) s.textContent = ``;
        };
        window.speechSynthesis.speak(utter);
      } catch (err) {
        if (statusEl) statusEl.textContent = `語音播放受系統限制，請再試一次。`;
      }
    }

    function toggleTtsSpeed() {
      APP_STATE.ttsRate = APP_STATE.ttsRate === 0.95 ? 0.72 : 0.95;
      const btn = document.getElementById(`btn-tts-speed`);
      if (btn) {
        btn.textContent = APP_STATE.ttsRate === 0.95 ? `🔊 語速：正常 (0.95x)` : `🔊 語速：慢速清晰 (0.72x)`;
      }
      saveState();
    }

    // =========================================================================
    // 6. HELPERS & PERSISTENCE SYNC
    // =========================================================================
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, `&amp;`)
        .replace(/</g, `&lt;`)
        .replace(/>/g, `&gt;`)
        .replace(/"/g, `&quot;`);
    }

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    async function saveState() {
      if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === `function`) {
        try {
          await window.notebookAppApi.setAppState({
            activeChapter: APP_STATE.activeChapter,
            activeTab: APP_STATE.activeTab,
            ttsRate: APP_STATE.ttsRate,
            masteredIds: APP_STATE.masteredIds,
            mistakeKeys: APP_STATE.mistakeKeys,
            quizStats: APP_STATE.quizStats,
            toolState: APP_STATE.toolState
          });
        } catch (e) { /* safe fallback */ }
      }
    }

    function updateHeaderStats() {
      const allCards = getAllVocabCards();
      const masteredEl = document.getElementById(`stat-mastered`);
      const quizzesEl = document.getElementById(`stat-quizzes`);
      const accEl = document.getElementById(`stat-accuracy`);
      const mistEl = document.getElementById(`stat-mistakes`);
      if (masteredEl) masteredEl.textContent = `${APP_STATE.masteredIds.length} / ${allCards.length}`;
      if (quizzesEl) quizzesEl.textContent = `${APP_STATE.quizStats.totalAnswered} 題`;
      if (accEl) {
        accEl.textContent = APP_STATE.quizStats.totalAnswered > 0
          ? `${Math.round((APP_STATE.quizStats.totalCorrect / APP_STATE.quizStats.totalAnswered) * 100)}%`
          : `—`;
      }
      if (mistEl) mistEl.textContent = `${APP_STATE.mistakeKeys.length} 題`;
    }

    function getAllVocabCards() {
      return [].concat(VOCAB_DB.K1, VOCAB_DB.K2, VOCAB_DB.K3, VOCAB_DB.K4, VOCAB_DB.K5, VOCAB_DB.K6);
    }

    function handleResetProgress(btn) {
      if (!btn) return;
      if (btn.dataset.armed !== `true`) {
        btn.dataset.armed = `true`;
        btn.textContent = `再點一次確認重置`;
        btn.classList.add(`btn-primary`);
        setTimeout(() => {
          if (btn && btn.dataset.armed === `true`) {
            btn.dataset.armed = `false`;
            btn.textContent = `重置學習紀錄`;
            btn.classList.remove(`btn-primary`);
          }
        }, 3500);
        return;
      }
      btn.dataset.armed = `false`;
      btn.textContent = `重置學習紀錄`;
      btn.classList.remove(`btn-primary`);
      APP_STATE.masteredIds = [];
      APP_STATE.mistakeKeys = [];
      APP_STATE.quizStats = { totalAnswered: 0, totalCorrect: 0, bestByChapter: {} };
      saveState();
      updateHeaderStats();
      renderWorkspace();
    }

      currentCardOrder = shuffleArray(cards.map(c => c.id));
      renderFlashcardsTab(APP_STATE.activeChapter);

    function getFilteredCards(chId) {
      const list = chId === `RAST_WEAK`
        ? getAllVocabCards().filter(c => !APP_STATE.masteredIds.includes(c.id))
        : (VOCAB_DB[chId] || []);
      if (APP_STATE.genderFilter === `all`) return list;
      return list.filter(c => c.gender === APP_STATE.genderFilter);
    }

    function formatWordDisplay(card) {
      if (card.sep && card.stem) {
        return `<span class="trennbar-prefix">${escapeHtml(card.sep)}</span><span style="opacity:0.5; margin:0 2px;">|</span>${escapeHtml(card.stem)}`;
      }
      return escapeHtml(card.word);

      if (g === `m`) return { cls: `badge-m`, txt: `der 陽性` };
      if (g === `n`) return { cls: `badge-n`, txt: `das 中性` };
      if (g === `f`) return { cls: `badge-f`, txt: `die 陰性` };
      if (g === `p`) return { cls: `badge-p`, txt: `Plural 複數` };
      return { cls: `badge-v`, txt: `Verb 動詞` };
    }

    /* --- KAPITEL 2 TOOLS --- */
    function numberToGerman(n) {
      n = Math.max(0, Math.min(200, Math.round(Number(n) || 0)));
      const units = [`null`, `eins`, `zwei`, `drei`, `vier`, `fünf`, `sechs`, `sieben`, `acht`, `neun`];
      const teens = [`zehn`, `elf`, `zwölf`, `dreizehn`, `vierzehn`, `fünfzehn`, `sechzehn`, `siebzehn`, `achtzehn`, `neunzehn`];
      const tens = [``, ``, `zwanzig`, `dreißig`, `vierzig`, `fünfzig`, `sechzig`, `siebzig`, `achtzig`, `neunzig`];
      if (n === 200) return `zweihundert`;
      let prefix = ``;
      let rem = n;
      if (n >= 100) {
        prefix = `einhundert`;
        rem = n - 100;
        if (rem === 0) return `einhundert`;
      }
      if (rem < 10) return prefix + units[rem];
      if (rem < 20) return prefix + teens[rem - 10];
      const u = rem % 10;
      const t = Math.floor(rem / 10);
      if (u === 0) return prefix + tens[t];
      const uWord = u === 1 ? `ein` : units[u];
      return `${prefix}${uWord}und${tens[t]}`;
    }

    /* --- KAPITEL 4 TOOLS --- */
    function formatGermanTime(h, m, mode) {
      const h24 = Number(h) % 24;
      const m60 = Number(m) % 60;
      const numWords = [`null`, `ein`, `zwei`, `drei`, `vier`, `fünf`, `sechs`, `sieben`, `acht`, `neun`, `zehn`, `elf`, `zwölf`];
      if (mode === `formal`) {
        const hw = numberToGerman(h24);
        const mw = m60 === 0 ? `` : ` ${numberToGerman(m60)}`;
        return `Es ist ${hw === `eins` ? `ein` : hw} Uhr${mw}.`;
      }
      const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
      const nextH12 = (h12 % 12) + 1;
      const hStr = h12 === 1 ? `eins` : numWords[h12];
      const nextStr = nextH12 === 1 ? `eins` : numWords[nextH12];
      if (m60 === 0) return `Es ist ${hStr} (Uhr).`;
      if (m60 === 15) return `Es ist Viertel nach ${numWords[h12]}.`;
      if (m60 === 30) return `Es ist halb ${numWords[nextH12]}.`;
      if (m60 === 45) return `Es ist Viertel vor ${numWords[nextH12]}.`;
      if (m60 < 25) return `Es ist ${numberToGerman(m60)} nach ${numWords[h12]}.`;
      if (m60 < 30) return `Es ist ${numberToGerman(30 - m60)} vor halb ${numWords[nextH12]}.`;
      if (m60 < 40) return `Es ist ${numberToGerman(m60 - 30)} nach halb ${numWords[nextH12]}.`;
      return `Es ist ${numberToGerman(60 - m60)} vor ${numWords[nextH12]}.`;
    }

      const pad = n => String(n).padStart(2, `0`);
      const hAngle = ((h % 12) + m / 60) * 30;
      const mAngle = m * 6;
      const sep = K4_SEPARABLE[APP_STATE.toolState.k4VerbIdx] || K4_SEPARABLE[0];
      const inv = APP_STATE.toolState.k4Inverted;

      return `
        <div class="tools-grid">
          <section class="tool-block">

            <div class="filter-group">

                <circle cx="60" cy="60" r="3" fill="var(--outline)"/>
                <line x1="60" y1="12" x2="60" y2="18" stroke="var(--outline)" stroke-width="2.5"/>
                <line x1="108" y1="60" x2="102" y2="60" stroke="var(--outline)" stroke-width="2.5"/>

                  ${cart.map(id => {

    /* --- KAPITEL 6 TOOLS --- */
    function formatOrdinalGerman(d) {
      d = Number(d);
      if (d === 1) return `ersten`;
      if (d === 3) return `dritten`;
      if (d === 7) return `siebten`;
      if (d === 8) return `achten`;
      if (d < 20) return `${numberToGerman(d)}ten`;
      return `${numberToGerman(d)}sten`;
    }

    function buildK6Tools() {
      const fKey = APP_STATE.toolState.k6FamilyKey;
      const fNode = K6_FAMILY[fKey] || K6_FAMILY.eltern;
      const pRow = K6_POSSESSIVES[APP_STATE.toolState.k6PossIdx] || K6_POSSESSIVES[0];
      const day = APP_STATE.toolState.k6Day;
      const monthIdx = APP_STATE.toolState.k6Month;
      const months = [`Januar`, `Februar`, `März`, `April`, `Mai`, `Juni`, `Juli`, `August`, `September`, `Oktober`, `November`, `Dezember`];
      const ordStr = `am ${formatOrdinalGerman(day)} ${months[monthIdx - 1]}`;
      const pastMode = APP_STATE.toolState.k6PastMode;

      return `
        <div class="tools-grid">
          <section class="tool-block">
            <h3 class="tool-title">1. 互動家庭樹 & 所有格冠詞 (Possessivartikel)</h3>
            <div class="family-grid">
              ${Object.keys(K6_FAMILY).map(k => `

            <div class="field-group">
              <label class="field-label" for="k6-poss-sel">切換主詞查看所有格詞尾變化</label>
              <select id="k6-poss-sel" class="bauhaus-select" onchange="setK6Poss(this.value)">
                ${K6_POSSESSIVES.map((r, i) => `<option value="${i}" ${APP_STATE.toolState.k6PossIdx === i ? `selected` : ``}>${r.pro}</option>`).join(``)}
              </select>
            </div>
            <table class="bauhaus-table">
              <thead><tr><th>陽性/中性 (無-e)</th><th>陰性 (-e)</th><th>複數 (-e)</th></tr></thead>
              <tbody>
                <tr><td><strong>${escapeHtml(pRow.sgM)}</strong></td><td><strong>${escapeHtml(pRow.sgF)}</strong></td><td><strong>${escapeHtml(pRow.pl)}</strong></td></tr>
              </tbody>
            </table>
          </section>

          <section class="tool-block">
            <h3 class="tool-title">2. 序數日期產生器 & Präteritum (war / hatte)</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-sm);">
              <div class="field-group">
                <label class="field-label" for="k6-day">日期 (1–31)</label>
                <input type="number" id="k6-day" class="bauhaus-input" min="1" max="31" value="${day}" oninput="setK6Day(this.value)">
              </div>
              <div class="field-group">
                <label class="field-label" for="k6-month">月份</label>
                <select id="k6-month" class="bauhaus-select" onchange="setK6Month(this.value)">
                  ${months.map((mName, idx) => `<option value="${idx + 1}" ${monthIdx === idx + 1 ? `selected` : ``}>${idx + 1}. ${mName}</option>`).join(``)}
                </select>
              </div>
            </div>
            <div class="result-box highlight" style="display:flex; justify-content:space-between; align-items:center; gap:var(--space-sm);">
              <div>
                <div style="font-size:0.78rem; font-weight:700;">Ich habe am ${day}.${monthIdx}. Geburtstag → 讀作：</div>
                <strong style="font-size:1.15rem;">Ich habe ${escapeHtml(ordStr)} Geburtstag.</strong>
              </div>
              <button type="button" class="btn btn-sm" onclick="speakGerman(\`Ich habe ${ordStr} Geburtstag.\`)">🔊</button>
            </div>

            <div>
              <div class="filter-group" style="margin-bottom:8px;">
                <button type="button" class="chip ${pastMode === `war` ? `active` : ``}" onclick="setK6Past('war')">sein → war (當時在/是)</button>
                <button type="button" class="chip ${pastMode === `hatte` ? `active` : ``}" onclick="setK6Past('hatte')">haben → hatte (當時有)</button>
              </div>
              <table class="bauhaus-table">
                <thead><tr><th>人稱</th><th>過去式</th><th>例句</th></tr></thead>
                <tbody>
                  ${pastMode === `war` ? `
                    <tr><td>ich</td><td><strong>war</strong></td><td>Ich war zu Hause.</td></tr>
                    <tr><td>du</td><td><strong>warst</strong></td><td>Du warst leider nicht da.</td></tr>
                    <tr><td>er/es/sie</td><td><strong>war</strong></td><td>Das Fest war sehr schön!</td></tr>
                    <tr><td>wir / sie / Sie</td><td><strong>waren</strong></td><td>Alle Freunde waren da.</td></tr>
                    <tr><td>ihr</td><td><strong>wart</strong></td><td>Wart ihr auch da?</td></tr>
                  ` : `
                    <tr><td>ich</td><td><strong>hatte</strong></td><td>Ich hatte Geburtstag.</td></tr>
                    <tr><td>du</td><td><strong>hattest</strong></td><td>Du hattest viel Zeit.</td></tr>
                    <tr><td>er/es/sie</td><td><strong>hatte</strong></td><td>Sie hatte keine Zeit.</td></tr>
                    <tr><td>wir / sie / Sie</td><td><strong>hatten</strong></td><td>Wir hatten Live-Musik.</td></tr>
                    <tr><td>ihr</td><td><strong>hattet</strong></td><td>Hattet ihr Musik?</td></tr>
                  `}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      `;
    }
    function setK6Family(k) { APP_STATE.toolState.k6FamilyKey = k; saveState(); renderToolsTab(`K6`); }
    function setK6Poss(i) { APP_STATE.toolState.k6PossIdx = Number(i) || 0; saveState(); renderToolsTab(`K6`); }
    function setK6Day(d) { APP_STATE.toolState.k6Day = Math.max(1, Math.min(31, Number(d) || 1)); saveState(); renderToolsTab(`K6`); }
    function setK6Month(m) { APP_STATE.toolState.k6Month = Number(m) || 1; saveState(); renderToolsTab(`K6`); }
    function setK6Past(p) { APP_STATE.toolState.k6PastMode = p; saveState(); renderToolsTab(`K6`); }

    // =========================================================================
    // 10. RANDOMIZED QUIZ ENGINE (VOCAB + GRAMMAR + SHUFFLED OPTIONS)
    // =========================================================================
    let activeQuiz = {
      chapter: null,
      mode: `all`,
      questions: [],
      idx: 0,
      score: 0,
      answered: false
    };

    function renderQuizTab(chId) {
      const host = document.getElementById(`tab-content`);
      if (!host) return;
      if (activeQuiz.chapter !== chId || activeQuiz.questions.length === 0) {
        startQuiz(chId, activeQuiz.mode || `all`, false);
      }
      drawQuizUI(host, chId);
    }

    function startQuiz(chId, mode, shouldDraw = true) {
      let pool = [];
      if (chId === `RAST`) {
        pool = [].concat(QUIZ_BANK.K1, QUIZ_BANK.K2, QUIZ_BANK.K3, QUIZ_BANK.K4, QUIZ_BANK.K5, QUIZ_BANK.K6)
          .map((q, idx) => Object.assign({}, q, { _key: `RAST_${idx}` }));
        if (mode === `mistakes` && APP_STATE.mistakeKeys.length > 0) {
          const allFlat = [];
          [`K1`, `K2`, `K3`, `K4`, `K5`, `K6`].forEach(ck => {
            (QUIZ_BANK[ck] || []).forEach((q, qi) => allFlat.push(Object.assign({}, q, { _key: `${ck}_${qi}` })));
          });
          pool = allFlat.filter(q => APP_STATE.mistakeKeys.includes(q._key));
        }
      } else {
        pool = (QUIZ_BANK[chId] || []).map((q, qi) => Object.assign({}, q, { _key: `${chId}_${qi}` }));
      }

      if (mode === `vocab`) pool = pool.filter(q => q.cat === `vocab`);
      else if (mode === `grammar`) pool = pool.filter(q => q.cat === `grammar`);

      const count = chId === `RAST` ? 15 : 10;
      const picked = shuffleArray(pool).slice(0, Math.min(count, pool.length)).map(q => {
        const indexed = q.opts.map((txt, i) => ({ txt, isCorrect: i === q.ans }));
        const shuffledOpts = shuffleArray(indexed);
        return {
          _key: q._key,
          cat: q.cat,
          q: q.q,
          opts: shuffledOpts.map(o => o.txt),
          ans: shuffledOpts.findIndex(o => o.isCorrect),
          exp: q.exp
        };
      });

      activeQuiz = {
        chapter: chId,
        mode,
        questions: picked,
        idx: 0,
        score: 0,
        answered: false
      };

      if (shouldDraw) {
        const host = chId === `RAST` ? document.getElementById(`rast-quiz-host`) : document.getElementById(`tab-content`);
        if (host) drawQuizUI(host, chId);
      }
    }

    function drawQuizUI(host, chId) {
      const qList = activeQuiz.questions;
      const isRast = chId === `RAST`;

      const modeBar = isRast ? `
        <div class="filter-group" style="margin-bottom:var(--space-md);">
          <button type="button" class="chip ${activeQuiz.mode === `all` ? `active` : ``}" onclick="startQuiz('RAST','all',true)">🎲 跨章節大挑戰 (隨機15題)</button>
          <button type="button" class="chip ${activeQuiz.mode === `vocab` ? `active` : ``}" onclick="startQuiz('RAST','vocab',true)">詞彙詞性專練 (15題)</button>
          <button type="button" class="chip ${activeQuiz.mode === `mistakes` ? `active` : ``}" onclick="startQuiz('RAST','mistakes',true)">🎯 錯題特訓 (${APP_STATE.mistakeKeys.length}題)</button>
        </div>
      ` : `
        <div class="toolbar" style="margin-bottom:var(--space-md);">
          <div class="filter-group">
            <button type="button" class="chip ${activeQuiz.mode === `all` ? `active` : ``}" onclick="startQuiz('${chId}','all',true)">🎲 綜合測驗 (隨機10題)</button>
            <button type="button" class="chip ${activeQuiz.mode === `vocab` ? `active` : ``}" onclick="startQuiz('${chId}','vocab',true)">📘 單字與詞性專練</button>
            <button type="button" class="chip ${activeQuiz.mode === `grammar` ? `active` : ``}" onclick="startQuiz('${chId}','grammar',true)">⚙️ 文法與句型專練</button>
          </div>
          <button type="button" class="btn btn-sm" onclick="startQuiz('${chId}','${activeQuiz.mode}',true)">🔄 重新抽題洗牌</button>
        </div>
      `;

      if (qList.length === 0) {
        host.innerHTML = `${modeBar}<div class="quiz-panel"><strong>目前錯題庫為空！</strong> 太棒了，先進行綜合測驗來挑戰自己吧。</div>`;
        return;
      }

      if (activeQuiz.idx >= qList.length) {
        const pct = Math.round((activeQuiz.score / qList.length) * 100);
        if (!isRast) {
          const prevBest = APP_STATE.quizStats.bestByChapter[chId] || 0;
          if (pct > prevBest) APP_STATE.quizStats.bestByChapter[chId] = pct;
          saveState();
        }
        host.innerHTML = `
          ${modeBar}
          <div class="quiz-panel">
            <span class="kicker">測驗完成</span>
            <h3 style="margin:0; font-family:var(--font-headline); font-size:2rem;">得分：${activeQuiz.score} / ${qList.length} (${pct}%)</h3>
            <p style="margin:0; color:var(--on-surface-variant);">每次重新開始都會從題庫中隨機抽取不同題目並重新排列選項順序。</p>
            <div>
              <button type="button" class="btn btn-primary" onclick="startQuiz('${chId}','${activeQuiz.mode}',true)">再測一次（隨機新題組）</button>
            </div>
          </div>
        `;
        return;
      }

      const cur = qList[activeQuiz.idx];
      const pctBar = Math.round((activeQuiz.idx / qList.length) * 100);

      host.innerHTML = `
        ${modeBar}
        <div class="quiz-panel">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="badge ${cur.cat === `vocab` ? `badge-m` : `badge-v`}">${cur.cat === `vocab` ? `單字 / 詞性` : `文法 / 句型`}</span>
            <strong style="font-variant-numeric:tabular-nums;">第 ${activeQuiz.idx + 1} / ${qList.length} 題 · 目前得分 ${activeQuiz.score}</strong>
          </div>
          <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pctBar}%;"></div></div>
          <div style="display:flex; justify-content:space-between; align-items:start; gap:var(--space-sm);">
            <h3 style="margin:0; font-size:1.2rem; line-height:1.4;">${escapeHtml(cur.q)}</h3>
          </div>
          <div class="quiz-options" id="quiz-opts">
            ${cur.opts.map((opt, oi) => `
              <button type="button" class="quiz-opt" onclick="answerQuiz(${oi}, '${chId}')">${escapeHtml(opt)}</button>
            `).join(``)}
          </div>
          <div id="quiz-feedback"></div>
        </div>
      `;
    }

    function answerQuiz(chosenIdx, chId) {
      if (activeQuiz.answered) return;
      activeQuiz.answered = true;
      const cur = activeQuiz.questions[activeQuiz.idx];
      const isCorrect = chosenIdx === cur.ans;

      APP_STATE.quizStats.totalAnswered += 1;
      if (isCorrect) {
        activeQuiz.score += 1;
        APP_STATE.quizStats.totalCorrect += 1;
        const mIdx = APP_STATE.mistakeKeys.indexOf(cur._key);
        if (mIdx >= 0) APP_STATE.mistakeKeys.splice(mIdx, 1);
      } else {
        if (cur._key && !APP_STATE.mistakeKeys.includes(cur._key)) {
          APP_STATE.mistakeKeys.push(cur._key);
        }
      }
      saveState();
      updateHeaderStats();

      const btns = document.querySelectorAll(`#quiz-opts .quiz-opt`);
      btns.forEach((b, i) => {
        b.disabled = true;
        if (i === cur.ans) b.classList.add(`correct`);
        else if (i === chosenIdx && !isCorrect) b.classList.add(`wrong`);
      });

      const fb = document.getElementById(`quiz-feedback`);
      if (fb) {
        fb.innerHTML = `
          <div class="result-box ${isCorrect ? `` : `highlight`}" style="margin-top:var(--space-sm);">
            <strong>${isCorrect ? `✓ 答對了！` : `✕ 再注意一下！`}</strong> ${escapeHtml(cur.exp)}
            <div style="margin-top:var(--space-sm); display:flex; gap:var(--space-sm); flex-wrap:wrap;">
              <button type="button" class="btn btn-primary btn-sm" onclick="nextQuizQuestion('${chId}')">${activeQuiz.idx + 1 < activeQuiz.questions.length ? `下一題 →` : `查看成績`}</button>
              <button type="button" class="btn-tts" onclick="speakGerman(\`${cur.opts[cur.ans].replace(/`/g, ``)}\`)">🔊 聽正解發音</button>
            </div>
          </div>
        `;
      }
    }

    function nextQuizQuestion(chId) {
      activeQuiz.idx += 1;
      activeQuiz.answered = false;
      const host = chId === `RAST` ? document.getElementById(`rast-quiz-host`) : document.getElementById(`tab-content`);
      if (host) drawQuizUI(host, chId);
    }

    // =========================================================================
    // 11. RASTSTÄTTE 1–6 REVIEW HUB
    // =========================================================================
    function renderRaststaette(meta) {
      const chapters = [`K1`, `K2`, `K3`, `K4`, `K5`, `K6`];
      setTimeout(() => {
        const qHost = document.getElementById(`rast-quiz-host`);
        if (qHost) {
          startQuiz(`RAST`, `all`, false);
          drawQuizUI(qHost, `RAST`);
        }
        renderRastWeakCards();
      }, 0);

      return `
        <section class="chapter-banner ${meta.accent}">
          <div>
            <span class="kicker">RASTSTÄTTE 總複習站</span>
            <h2 style="margin:0; font-family:var(--font-headline); font-size:var(--headline-size);">${escapeHtml(meta.title)}</h2>
            <p style="margin:4px 0 0 0;">${escapeHtml(meta.desc)}</p>
          </div>
        </section>

        <div class="tools-grid">
          <section class="tool-block">
            <h3 class="tool-title">各章節單字掌握與最佳測驗</h3>
            <table class="bauhaus-table">
              <thead><tr><th>章節</th><th>單字掌握</th><th>最佳成績</th><th>前往</th></tr></thead>
              <tbody>
                ${chapters.map(c => {
                  const list = VOCAB_DB[c] || [];
                  const mCnt = list.filter(x => APP_STATE.masteredIds.includes(x.id)).length;
                  const best = APP_STATE.quizStats.bestByChapter[c];
                  return `
                    <tr>
                      <td><strong>${c}</strong></td>
                      <td>${mCnt} / ${list.length}</td>
                      <td>${best !== undefined ? `${best}%` : `—`}</td>
                      <td><button type="button" class="btn btn-sm" onclick="switchChapter('${c}')">複習</button></td>
                    </tr>
                  `;
                }).join(``)}
              </tbody>
            </table>
          </section>

          <section class="tool-block">
            <h3 class="tool-title">A1 核心文法速查表 (Cheat Sheet)</h3>
            <table class="bauhaus-table">
              <tbody>
                <tr><th>動詞位置</th><td>陳述句/W-問句在 <strong>Pos. 2</strong>；Ja/Nein 問句在 <strong>Pos. 1</strong></td></tr>
                <tr><th>可分動詞</th><td>變化詞幹在 Pos. 2，可分前綴 (auf/an/ein/fern) 在<strong>句尾</strong></td></tr>
                <tr><th>詞性替換</th><td>der → <strong>er</strong> · das → <strong>es</strong> · die → <strong>sie</strong></td></tr>
                <tr><th>第四格 Akkusativ</th><td>唯獨陽性改變：der/ein/kein → <strong>den/einen/keinen</strong></td></tr>
                <tr><th>過去式基礎</th><td>sein → <strong>war / warst / waren</strong> · haben → <strong>hatte / hatten</strong></td></tr>
              </tbody>
            </table>
          </section>

          <section class="tool-block full-span">
            <h3 class="tool-title">Raststätte 1–6 跨章節隨機綜合測驗 & 錯題重練</h3>
            <div id="rast-quiz-host"></div>
          </section>

          <section class="tool-block full-span">
            <h3 class="tool-title">待加強單字速覽（尚未標記掌握之單字，點擊發音或直接標記）</h3>
            <div id="rast-weak-host"></div>
          </section>
        </div>
      `;
    }

    function renderRastWeakCards() {
      const host = document.getElementById(`rast-weak-host`);
      if (!host) return;
      const weak = getAllVocabCards().filter(c => !APP_STATE.masteredIds.includes(c.id));
      if (weak.length === 0) {
        host.innerHTML = `<div class="result-box highlight"><strong>太驚人了！你已掌握全部 84 張核心單字卡！</strong></div>`;
        return;
      }
      host.innerHTML = `
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:var(--space-sm);">
          ${weak.slice(0, 12).map(c => {
            const gl = genderLabel(c.gender);
            const safeW = c.word.replace(/\|/g, ``).replace(/`/g, ``);
            return `
              <div class="result-box" style="display:grid; gap:4px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span class="badge ${gl.cls}">${gl.txt}</span>
                  <button type="button" class="btn-tts" onclick="speakGerman(\`${safeW}\`)">🔊</button>
                </div>
                <strong>${escapeHtml(c.word.replace(/\|/g, ``))}</strong>
                <span style="font-size:0.84rem; color:var(--on-surface-variant);">${escapeHtml(c.zh)}</span>
                <button type="button" class="btn btn-sm" onclick="toggleMastered('${c.id}')">✓ 標記已掌握</button>
              </div>
            `;
          }).join(``)}
        </div>
        ${weak.length > 12 ? `<p style="margin:8px 0 0 0; font-size:0.84rem; color:var(--on-surface-variant);">還有 ${weak.length - 12} 張單字待掌握，請切換至各章節「單字閃卡」完成練習。</p>` : ``}
      `;
    }

    // =========================================================================
    // 12. INITIALIZATION
    // =========================================================================
    async function initApp() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
          const saved = await window.notebookAppApi.getAppState();
          if (saved && typeof saved === `object`) {
            if (saved.activeChapter) APP_STATE.activeChapter = saved.activeChapter;
            if (saved.activeTab) APP_STATE.activeTab = saved.activeTab;
            if (typeof saved.ttsRate === `number`) APP_STATE.ttsRate = saved.ttsRate;
            if (Array.isArray(saved.masteredIds)) APP_STATE.masteredIds = saved.masteredIds;
            if (Array.isArray(saved.mistakeKeys)) APP_STATE.mistakeKeys = saved.mistakeKeys;
            if (saved.quizStats) APP_STATE.quizStats = Object.assign({}, APP_STATE.quizStats, saved.quizStats);
            if (saved.toolState) APP_STATE.toolState = Object.assign({}, APP_STATE.toolState, saved.toolState);
          }
        }
      } catch (e) { /* safe fallback */ }

      const speedBtn = document.getElementById(`btn-tts-speed`);
      if (speedBtn) {
        speedBtn.textContent = APP_STATE.ttsRate === 0.95 ? `🔊 語速：正常 (0.95x)` : `🔊 語速：慢速清晰 (0.72x)`;
      }

      if (`speechSynthesis` in window) {
        window.speechSynthesis.getVoices();
      }

      updateHeaderStats();
      renderNav();
      renderWorkspace();

      if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
        window.notebookAppApi.notifyAppReady();
      }
    }

    document.addEventListener(`DOMContentLoaded`, initApp);
  </script>
</body>
</html>
